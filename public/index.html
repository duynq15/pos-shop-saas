<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1D4ED8">
<title>POS Shop – Phần mềm bán hàng chuyên nghiệp</title>
<link rel="icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-loading" class="app-loading"><div class="spinner"></div><p>Đang tải…</p></div>

<div id="login-screen" class="login-screen hidden">
  <form id="login-form" class="login-card">
    <div class="login-brand"><span class="brand-logo" data-icon="wallet"></span><b>POS Shop</b></div>
    <p class="muted" id="login-tenant">Đăng nhập vào cửa hàng của bạn</p>
    <label class="fld">Tài khoản<input class="field" id="login-user" autocomplete="username" autocapitalize="none" autofocus></label>
    <label class="fld">Mật khẩu<input class="field" id="login-pass" type="password" autocomplete="current-password"></label>
    <div id="login-error" class="login-error"></div>
    <button class="btn primary big" id="login-submit" type="submit">Đăng nhập</button>
  </form>
</div>

<header class="topbar" id="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="brand-logo" data-icon="wallet"></span><span class="brand-name" id="brand-name">POS Shop</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-lan" aria-label="Kết nối LAN" title="Kết nối thiết bị khác qua LAN" data-icon="wifi"></button>
      <div class="sidebar-user" id="sidebar-user"></div>
    </div>
    <nav class="nav-list" id="nav-list" aria-label="Chức năng"></nav>
  </div>
  <div class="nav-subrow" id="nav-subrow"></div>
</header>

<main id="main"></main>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="print-area"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
