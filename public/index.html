<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>POS Shop – Phần mềm bán hàng chuyên nghiệp</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-loading" class="app-loading"><div class="spinner"></div><p>Đang tải…</p></div>

<div id="login-screen" class="login-screen hidden">
  <form id="login-form" class="login-card">
    <div class="login-brand">🛒 <b>POS Shop</b></div>
    <p class="muted" id="login-tenant">Đăng nhập vào cửa hàng của bạn</p>
    <label class="fld">Tài khoản<input class="field" id="login-user" autocomplete="username" autocapitalize="none" autofocus></label>
    <label class="fld">Mật khẩu<input class="field" id="login-pass" type="password" autocomplete="current-password"></label>
    <div id="login-error" class="login-error"></div>
    <button class="btn primary big" id="login-submit" type="submit">Đăng nhập</button>
  </form>
</div>

<nav class="sidebar" id="sidebar">
  <div class="brand">
    <span class="brand-logo">🛒</span>
    <span class="brand-name" id="brand-name">POS Shop</span>
  </div>
  <div class="nav-list" id="nav-list"></div>
  <div class="sidebar-foot">
    <div class="sidebar-user" id="sidebar-user"></div>
    <button class="nav-item" id="btn-lan"><span class="nav-icon">📶</span><span class="nav-label">Kết nối LAN</span></button>
    <div class="version" id="app-version"></div>
  </div>
</nav>

<div class="mobile-topbar">
  <button class="icon-btn" id="btn-menu">☰</button>
  <span id="mobile-title">Bán hàng</span>
  <span class="icon-btn" id="mobile-user">🧑‍💼</span>
</div>

<main id="main"></main>

<div id="nav-overlay" class="nav-overlay"></div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="print-area"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
